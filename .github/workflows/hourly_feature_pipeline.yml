name: Hourly Feature Pipeline

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

jobs:
  update-features:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy requests hopsworks python-dotenv pyarrow confluent-kafka

      - name: Run incremental feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          for i in 1 2 3; do
            python incremental_pipeline.py && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_processed_time.txt
          git diff --staged --quiet || git commit -m "Update last processed timestamp [skip ci]"
          git push