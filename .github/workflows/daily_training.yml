name: Daily Training Pipeline

on:
  schedule:
    - cron: "30 2 * * *"  # 2:30 AM UTC daily
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn joblib hopsworks python-dotenv pyarrow confluent-kafka

      - name: Retrain models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          for i in 1 2 3; do
            python train_from_hopsworks.py && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done

      - name: Push models to registry
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          for i in 1 2 3; do
            python push_models_to_registry.py && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done